<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>paint.hoc.run</title>
  <link rel="stylesheet" href="../global.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { user-select: none; }
    select { font-family: var(--font); font-size: 12px; color: var(--fg); background: var(--bg); border: 1px solid var(--border); outline: none; }
    select:focus { border-color: var(--accent); }

    .topbar button { padding: 2px 12px; font-size: 12px; }
    .topbar .first { margin-left: auto; }
    .saved { color: var(--dim); font-size: 11px; min-width: 64px; text-align: right; }

    .main { flex: 1; display: flex; min-height: 0; }

    /* left ribbon: tools, then the selected tool's options */
    .tools { width: 124px; flex-shrink: 0; border-right: 1px solid var(--border); padding: 8px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
    #toolBtns { display: flex; flex-direction: column; gap: 4px; }
    .tools button, .layer-btns button, .opts button { border-color: var(--border); color: var(--fg); padding: 2px 6px; font-size: 12px; text-align: left; }
    .tools button:hover, .layer-btns button:hover, .opts button:hover { background: var(--border); color: var(--fg); }
    .tools button.on, .opts button.on { border-color: var(--accent); color: var(--accent); }
    .tools button .key { color: var(--dim); float: right; }
    .tools .sep { height: 8px; flex-shrink: 0; }
    .divider { height: 1px; background: var(--border); margin: 8px 0 4px; flex-shrink: 0; }
    #subOpts { display: flex; flex-direction: column; gap: 10px; }
    .sub { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--dim); }
    .sub .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .sub .grid2 button { text-align: center; padding: 2px 0; }
    .sub input[type=number], .sub select { width: 100%; padding: 1px 4px; font-size: 12px; }
    .sub input[type=range] { width: 100%; accent-color: var(--accent); }
    .sub .hint { font-size: 10px; line-height: 1.4; }

    /* canvas */
    .view { flex: 1; position: relative; min-width: 0; background: var(--bg); overflow: hidden; }
    #view { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; display: block; }
    #textBox { position: absolute; display: none; background: transparent; border: none; outline: 1px dashed var(--dim); outline-offset: 2px;
               color: transparent; caret-color: var(--accent); resize: none; overflow: hidden; white-space: pre; padding: 0; margin: 0; z-index: 2; }

    /* layers */
    .layers { width: 220px; flex-shrink: 0; border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
    .panel-title { color: var(--dim); font-size: 12px; padding: 8px 8px 4px; }
    #layerList { flex: 1; overflow-y: auto; }
    .layer { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-left: 2px solid transparent; cursor: pointer; font-size: 12px; }
    .layer:hover { background: var(--border); }
    .layer.active { border-left-color: var(--accent); background: var(--border); }
    .layer .eye { width: 16px; color: var(--accent); text-align: center; }
    .layer.hidden .eye, .layer.hidden .name { color: var(--dim); }
    .layer canvas { width: 40px; height: 30px; border: 1px solid var(--border); flex-shrink: 0; background: var(--bg); image-rendering: pixelated; }
    .layer .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .layer .op { color: var(--dim); font-size: 11px; }
    .layer input { width: 100%; font-size: 12px; padding: 0 2px; }
    .layer-ctl { border-top: 1px solid var(--border); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .layer-ctl label { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 8px; }
    .layer-ctl input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
    #opv { width: 36px; text-align: right; flex-shrink: 0; }
    .layer-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
    .layer-btns button { text-align: center; }

    /* bottom bar */
    .bottom { border-top: 1px solid var(--border); display: flex; align-items: center; gap: 6px 16px; padding: 6px 16px; flex-shrink: 0; flex-wrap: wrap; font-size: 12px; }
    .colors { position: relative; width: 40px; height: 36px; flex-shrink: 0; }
    .colors div { position: absolute; width: 24px; height: 24px; border: 1px solid var(--dim); cursor: pointer; }
    .colors div.editing { border-color: var(--accent); }
    #prim { left: 0; top: 0; z-index: 1; }
    #sec { right: 0; bottom: 0; }
    .palette { display: grid; grid-template-columns: repeat(14, 16px); grid-auto-rows: 16px; gap: 2px; }
    .palette div { border: 1px solid var(--border); cursor: pointer; }
    .palette div:hover { border-color: var(--fg); }
    .opts { display: flex; align-items: center; gap: 6px; color: var(--dim); }
    .status { margin-left: auto; color: var(--dim); white-space: nowrap; }
    .status .warn { color: #ff4444; }

    /* color popup */
    .cpop { position: fixed; display: none; flex-direction: column; gap: 8px; background: var(--bg); border: 1px solid var(--border); padding: 10px; z-index: 20; font-size: 11px; color: var(--dim); }
    .cpop.open { display: flex; }
    .cpop canvas { display: block; cursor: crosshair; touch-action: none; }
    .cpop .tabs { display: flex; gap: 4px; }
    .cpop .tabs button { flex: 1; border-color: var(--border); color: var(--dim); padding: 1px 0; font-size: 11px; }
    .cpop .tabs button.on { border-color: var(--accent); color: var(--accent); }
    .cpop .tabs button:hover { background: var(--border); }
    .cpop .row { display: flex; gap: 6px; align-items: center; }
    .cpop input { font-size: 12px; padding: 1px 4px; }
    #cpHex { width: 100px; }
    #cpAlpha { width: 52px; }

    /* dialog */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 10; }
    .modal.open { display: flex; }
    .dialog { background: var(--bg); border: 1px solid var(--border); padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 280px; }
    .dialog .row { display: flex; gap: 8px; align-items: center; }
    .dialog input { width: 80px; padding: 2px 6px; }
    .dialog .hint { color: var(--dim); font-size: 11px; }
    .dialog .btns { display: flex; gap: 8px; justify-content: flex-end; }
    #fileIn { display: none; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="prompt">$ <a href="https://ad.hoc.run">ad.hoc.run</a> → <span class="path">paint.hoc.run</span></div>
    <span class="saved first" id="saved"></span>
    <button id="bNew" title="new canvas / resize">size</button>
    <button id="bOpen" title="open image (or drop / paste one)">open</button>
    <button id="bSave" title="save flattened png (ctrl+s)">save png</button>
  </div>

  <div class="main">
    <div class="tools">
      <div id="toolBtns"></div>
      <div class="divider" id="subDiv"></div>
      <div id="subOpts">
        <div class="sub" data-for="pencil brush eraser line rect ellipse">
          size <input type="range" id="size" min="1" max="100"> <input type="number" id="sizeN" min="1" max="500">
        </div>
        <div class="sub" data-for="rect ellipse" id="shapeOpts">
          <button data-mode="outline">outline</button><button data-mode="fill">fill</button><button data-mode="both" title="outline = primary, fill = secondary">both</button>
        </div>
        <div class="sub" data-for="fill wand" title="how different a color can be and still count as the same">
          tolerance % <input type="number" id="tol" min="0" max="100">
        </div>
        <div class="sub" data-for="text">
          font <select id="tFont"></select>
          size <input type="number" id="tSize" min="4" max="1000">
          <div class="grid2"><button id="tBold"><b>bold</b></button><button id="tItalic"><i>italic</i></button></div>
          <button id="tCrisp" title="no anti-aliasing, hard pixel edges">crisp</button>
          <div class="hint">click to type. ctrl+enter or click away to place, esc cancels.</div>
        </div>
        <div class="sub" data-for="select wand move">
          <div class="grid2">
            <button id="sAll" title="select all (ctrl+a)">all</button>
            <button id="sNone" title="deselect (ctrl+d)">none</button>
          </div>
          <button id="sInv" title="invert selection (ctrl+shift+i)">invert</button>
          <div class="grid2">
            <button id="sFlipH" title="mirror left/right">⇆</button>
            <button id="sFlipV" title="mirror up/down">⇅</button>
            <button id="sRotL" title="rotate 90° left">⟲ 90</button>
            <button id="sRotR" title="rotate 90° right">⟳ 90</button>
            <button id="sSnap" title="snap rotation to 15° and scale to 25% steps (hold alt to invert)">snap</button>
            <button id="sSmooth" title="smooth (bilinear) instead of crisp pixels when rotating/scaling">smooth</button>
            <button id="sApply" title="apply transform (enter)">apply</button>
            <button id="sCancel" title="cancel transform (esc)">cancel</button>
          </div>
        </div>
      </div>
    </div>
    <div class="view" id="viewWrap"><canvas id="view"></canvas><textarea id="textBox" spellcheck="false"></textarea></div>
    <div class="layers">
      <div class="panel-title">layers</div>
      <div id="layerList"></div>
      <div class="layer-ctl">
        <label>opacity <input type="range" id="opacity" min="0" max="100"> <span id="opv"></span></label>
        <div class="layer-btns">
          <button id="lAdd" title="new layer">+ new</button>
          <button id="lDup" title="duplicate layer">dup</button>
          <button id="lDel" title="delete layer">del</button>
          <button id="lUp" title="move layer up">↑ up</button>
          <button id="lDown" title="move layer down">↓ dn</button>
          <button id="lMerge" title="merge into layer below">merge</button>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="colors" id="colors" title="click to edit. left click a swatch = primary, right click = secondary. x swaps.">
      <div id="prim"></div><div id="sec"></div>
    </div>
    <div class="palette" id="palette"></div>
    <div class="opts"><button id="bGrid" title="pixel grid (g), shows at 8x+">grid</button></div>
    <div class="status" id="status"></div>
  </div>

  <div class="cpop" id="cpop">
    <div class="tabs"><button data-w="primary">primary</button><button data-w="secondary">secondary</button></div>
    <canvas id="cpSV"></canvas>
    <canvas id="cpHue"></canvas>
    <canvas id="cpA"></canvas>
    <div class="row">hex <input id="cpHex" maxlength="9"> <input type="number" id="cpAlpha" min="0" max="100">%</div>
  </div>

  <div class="modal" id="modal">
    <div class="dialog">
      <div>canvas size</div>
      <div class="row">w <input type="number" id="dW" min="1" max="8192"> h <input type="number" id="dH" min="1" max="8192"></div>
      <div class="hint">resize keeps your layers (anchored top-left).<br>new starts a blank canvas and clears undo.</div>
      <div class="btns"><button id="dCancel">cancel</button><button id="dResize">resize</button><button id="dNew">new</button></div>
    </div>
  </div>
  <input type="file" id="fileIn" accept="image/*">

  <script>
    // ---------- setup ----------
    const $ = id => document.getElementById(id);
    const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const C = { bg: css('--bg'), fg: css('--fg'), dim: css('--dim'), accent: css('--accent'), border: css('--border') };
    const view = $('view'), vctx = view.getContext('2d');
    const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

    const TOOLS = [
      { id: 'pencil',  key: 'p', label: 'pencil' },
      { id: 'brush',   key: 'b', label: 'brush' },
      { id: 'eraser',  key: 'e', label: 'eraser' },
      { id: 'fill',    key: 'f', label: 'fill' },
      { id: 'picker',  key: 'i', label: 'pick' },
      { id: 'text',    key: 't', label: 'text' },
      null,
      { id: 'line',    key: 'l', label: 'line' },
      { id: 'rect',    key: 'r', label: 'rect' },
      { id: 'ellipse', key: 'o', label: 'ellipse' },
      null,
      { id: 'select',  key: 's', label: 'select' },
      { id: 'wand',    key: 'w', label: 'fill sel' },
      { id: 'move',    key: 'v', label: 'move' },
      { id: 'hand',    key: 'h', label: 'pan' },
    ];
    const SHAPES = ['line', 'rect', 'ellipse'];
    const SEL_TOOLS = ['select', 'wand', 'move'];
    const TRANSPARENT = '#00000000';
    const PALETTE = [
      '#000000','#7f7f7f','#880015','#ed1c24','#ff7f27','#fff200','#22b14c','#00a2e8','#3f48cc','#a349a4','#00ff88',TRANSPARENT,'#2a2a2a','#666666',
      '#ffffff','#c3c3c3','#b97a57','#ffaec9','#ffc90e','#efe4b0','#b5e61d','#99d9ea','#7092be','#c8bfe7','#00cc6a','#e2e2e2','#404040','#999999',
    ];
    const FONTS = [
      ['Arial', 'Arial, Helvetica, sans-serif'], ['Verdana', 'Verdana, Geneva, sans-serif'], ['Georgia', 'Georgia, serif'],
      ['Times', '"Times New Roman", Times, serif'], ['Courier', '"Courier New", Courier, monospace'],
      ['Comic Sans', '"Comic Sans MS", "Comic Sans", cursive'], ['Impact', 'Impact, "Arial Black", sans-serif'],
      ['Mono', 'var-font'],
    ];

    let W = 800, H = 600;
    let layers = [];          // index 0 = bottom
    let active = 0;
    let layerSeq = 1;
    let ui = { primary: '#000000', secondary: '#ffffff', tool: 'pencil', size: 1, shapeMode: 'outline', grid: true, tol: 0, snap: true, smooth: false,
               font: 'Arial', fontSize: 24, bold: false, italic: false, crisp: false };
    let zoom = 1, ox = 0, oy = 0;
    let mouse = null;         // doc coords of the cursor
    let spaceDown = false;
    // stroke buffers: tools draw opaque here, then it is blended onto the layer with the color's alpha
    const buf = mk(1, 1), bctx = buf.getContext('2d', { willReadFrequently: true });
    const buf2 = mk(1, 1), b2ctx = buf2.getContext('2d');
    const snap = mk(1, 1), sctx = snap.getContext('2d', { willReadFrequently: true });

    let sel = null;           // { mask: Uint8Array(W*H) 0/255, canvas, bbox:{x,y,w,h}, path }
    let float = null;         // lifted pixels being transformed (see lift())
    let text = null;          // text being typed (see startText())
    let antOff = 0;

    function newLayer(name) {
      const c = mk(W, H);
      return { id: layerSeq++, name: name || ('layer ' + (layerSeq - 1)), canvas: c,
               ctx: c.getContext('2d', { willReadFrequently: true }),
               visible: true, opacity: 1, ver: 0, blob: null, blobVer: -1 };
    }
    const cur = () => layers[active];

    // ---------- colors ----------
    // colors are '#rrggbb' or '#rrggbbaa'
    function parseCol(s) {
      const h = (s || '#000000').replace('#', '');
      return { r: parseInt(h.slice(0, 2), 16) || 0, g: parseInt(h.slice(2, 4), 16) || 0, b: parseInt(h.slice(4, 6), 16) || 0,
               a: h.length >= 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1 };
    }
    const hx = v => Math.round(v).toString(16).padStart(2, '0');
    const hex6 = c => '#' + hx(c.r) + hx(c.g) + hx(c.b);
    const toHex = c => hex6(c) + (c.a < 1 ? hx(c.a * 255) : '');
    const rgba = c => `rgba(${c.r},${c.g},${c.b},${c.a})`;
    const swatchBg = s => { const c = rgba(parseCol(s)); return `linear-gradient(${c},${c}), repeating-conic-gradient(${C.border} 0 25%, ${C.bg} 0 50%) 0 0 / 8px 8px`; };

    // ---------- history ----------
    let undoStack = [], redoStack = [], histBytes = 0;
    const HIST_MAX_BYTES = 400 * 1024 * 1024, HIST_MAX = 200;
    function entryBytes(e) {
      if (e.kind === 'px') return e.before.data.length * 2;
      if (e.kind === 'sel') return ((e.before && e.before.length) || 0) + ((e.after && e.after.length) || 0);
      if (e.kind === 'resize') return (e.before.W * e.before.H + e.after.W * e.after.H) * 4 * e.before.c.length;
      if (e.kind === 'multi') return e.parts.reduce((s, p) => s + entryBytes(p), 0);
      return 0;
    }
    function pushHist(e) {
      undoStack.push(e); histBytes += entryBytes(e);
      for (const r of redoStack) histBytes -= entryBytes(r);
      redoStack = [];
      while (undoStack.length > 1 && (histBytes > HIST_MAX_BYTES || undoStack.length > HIST_MAX)) histBytes -= entryBytes(undoStack.shift());
    }
    function clearHist() { undoStack = []; redoStack = []; histBytes = 0; }

    function structSnap() { return { list: layers.map(l => ({ l, name: l.name, visible: l.visible, opacity: l.opacity })), active }; }
    function applyStruct(s) {
      layers = s.list.map(o => { o.l.name = o.name; o.l.visible = o.visible; o.l.opacity = o.opacity; return o.l; });
      active = s.active;
    }
    function applyResize(s) {
      W = s.W; H = s.H;
      for (const [l, c] of s.c) { l.canvas = c; l.ctx = c.getContext('2d', { willReadFrequently: true }); touched(l); }
      sel = makeSel(s.sel); selChanged(); structChanged();
    }
    function applyEntry(e, dir) {     // dir: 'before' | 'after'
      if (e.kind === 'px') { e.layer.ctx.putImageData(e[dir], e.x, e.y); touched(e.layer); }
      else if (e.kind === 'struct') { applyStruct(e[dir]); structChanged(); }
      else if (e.kind === 'sel') { sel = makeSel(e[dir]); selChanged(); }
      else if (e.kind === 'resize') { applyResize(e[dir]); fit(); }
      else if (e.kind === 'multi') { const parts = dir === 'before' ? [...e.parts].reverse() : e.parts; parts.forEach(p => applyEntry(p, dir)); }
    }
    function undo() {
      commitText();
      if (float) { cancelFloat(); return; }     // first undo just drops the transform in progress
      const e = undoStack.pop(); if (!e) return; applyEntry(e, 'before'); redoStack.push(e); requestRender();
    }
    function redo() { commitFloat(); const e = redoStack.pop(); if (!e) return; applyEntry(e, 'after'); undoStack.push(e); requestRender(); }

    function structOp(fn) {
      commitFloat();
      const before = structSnap(); const extra = fn(); const after = structSnap();
      pushHist(extra ? { kind: 'multi', parts: [...extra, { kind: 'struct', before, after }] } : { kind: 'struct', before, after });
      structChanged();
    }

    // pixel snapshot of a layer, then commit the changed rect as an undo entry
    function beginPx(layer) {
      if (snap.width !== W || snap.height !== H) { snap.width = W; snap.height = H; }
      sctx.clearRect(0, 0, W, H); sctx.drawImage(layer.canvas, 0, 0);
      return { layer, x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
    }
    function grow(st, x0, y0, x1, y1) {
      st.x0 = Math.min(st.x0, Math.floor(x0)); st.y0 = Math.min(st.y0, Math.floor(y0));
      st.x1 = Math.max(st.x1, Math.ceil(x1));  st.y1 = Math.max(st.y1, Math.ceil(y1));
    }
    function endPx(st) {
      const x = Math.max(0, st.x0), y = Math.max(0, st.y0), x1 = Math.min(W, st.x1), y1 = Math.min(H, st.y1);
      if (x1 <= x || y1 <= y) return null;
      return { kind: 'px', layer: st.layer, x, y,
               before: sctx.getImageData(x, y, x1 - x, y1 - y),
               after: st.layer.ctx.getImageData(x, y, x1 - x, y1 - y) };
    }
    // undo the parts of a fresh change that fell outside the selection (restores from the snapshot)
    function clipToSel(layer, x0, y0, x1, y1) {
      if (!sel) return;
      x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0)); x1 = Math.min(W, Math.ceil(x1)); y1 = Math.min(H, Math.ceil(y1));
      const w = x1 - x0, h = y1 - y0; if (w <= 0 || h <= 0) return;
      const a = layer.ctx.getImageData(x0, y0, w, h), b = sctx.getImageData(x0, y0, w, h);
      const ad = new Uint32Array(a.data.buffer), bd = new Uint32Array(b.data.buffer), m = sel.mask;
      for (let y = 0; y < h; y++) { const row = (y0 + y) * W + x0; for (let x = 0; x < w; x++) if (!m[row + x]) ad[y * w + x] = bd[y * w + x]; }
      layer.ctx.putImageData(a, x0, y0);
    }
    function prepBufs() {
      for (const [c, x] of [[buf, bctx], [buf2, b2ctx]]) { if (c.width !== W || c.height !== H) { c.width = W; c.height = H; } else x.clearRect(0, 0, W, H); }
    }
    // rebuild rect of the layer = snapshot + each buffer pass. pass = [canvas, alpha, erase]
    function composite(st, x0, y0, x1, y1, passes) {
      x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0)); x1 = Math.min(W, Math.ceil(x1)); y1 = Math.min(H, Math.ceil(y1));
      const w = x1 - x0, h = y1 - y0; if (w <= 0 || h <= 0) return;
      const ctx = st.layer.ctx;
      ctx.save();
      ctx.clearRect(x0, y0, w, h); ctx.drawImage(snap, x0, y0, w, h, x0, y0, w, h);
      for (const [c, a, erase] of passes) {
        ctx.globalCompositeOperation = erase ? 'destination-out' : 'source-over';
        ctx.globalAlpha = erase ? 1 : a;
        ctx.drawImage(c, x0, y0, w, h, x0, y0, w, h);
      }
      ctx.restore();
      clipToSel(st.layer, x0, y0, x1, y1);
      grow(st, x0, y0, x1, y1);
    }

    // ---------- selection ----------
    function makeSel(mask) {
      if (!mask || mask.length !== W * H) return null;
      let x0 = W, y0 = H, x1 = -1, y1 = -1;
      for (let y = 0; y < H; y++) {
        const row = y * W; let rowAny = false;
        for (let x = 0; x < W; x++) if (mask[row + x]) { rowAny = true; if (x < x0) x0 = x; break; }
        if (!rowAny) continue;
        for (let x = W - 1; x >= 0; x--) if (mask[row + x]) { if (x > x1) x1 = x; break; }
        if (y < y0) y0 = y; y1 = y;
      }
      if (x1 < 0) return null;
      const c = mk(W, H), img = new ImageData(W, H), d = new Uint32Array(img.data.buffer);
      for (let i = 0; i < mask.length; i++) if (mask[i]) d[i] = 0xffffffff;

      if (e.key === ' ') { e.preventDefault(); if (!spaceDown) { spaceDown = true; if (!stroke) view.style.cursor = 'grab'; requestRender(); } return; }
      if (e.key === 'Enter') { commitFloat(); return; }
      if (e.key === 'Escape') { if (float) cancelFloat(); else deselect(); return; }
      if (e.key.startsWith('Arrow') && (sel || float)) {
        e.preventDefault();
        if (!lift()) return;
        const n = e.shiftKey ? 10 : 1;
        if (k === 'arrowleft') float.cx -= n; if (k === 'arrowright') float.cx += n;
        if (k === 'arrowup') float.cy -= n; if (k === 'arrowdown') float.cy += n;
        floatChanged(); touched(float.layer); return;
      }
      const t = TOOLS.find(t => t && t.key === k); if (t) { setTool(t.id); return; }
      if (k === 'x') { const p = ui.primary; setColor('primary', ui.secondary); setColor('secondary', p); }
      else if (k === 'g') setGrid(!ui.grid);
      else if (k === '[') setSize(ui.size - (ui.size > 10 ? 5 : 1));
      else if (k === ']') setSize(ui.size + (ui.size >= 10 ? 5 : 1));
      else if (k === '+' || k === '=') zoomStep(1);
      else if (k === '-') zoomStep(-1);
      else if (k === '0') fit();
      else if (k === '1') zoomAt(1, view.clientWidth / 2, view.clientHeight / 2);
      else if (k === 'delete' || k === 'backspace') {
        if (sel || float) { clearSelPixels(); return; }
        const l = cur(); const st = beginPx(l); l.ctx.clearRect(0, 0, W, H); grow(st, 0, 0, W, H);
        const ent = endPx(st); if (ent) { pushHist(ent); touched(l); requestRender(); }
      }
    });
    document.addEventListener('keyup', e => { if (e.key === ' ') { spaceDown = false; if (!panning) setTool(ui.tool); } });
    window.addEventListener('resize', () => { requestRender(); if (cp.open) openCP(cp.which); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && db) { clearTimeout(saveTimer); save(); } });

    // ---------- boot ----------
    (async () => {
      buildTools();
      db = await openDB();
      const ok = await load();
      if (ok) { structChanged(); fit(); $('saved').textContent = 'restored'; }
      else newDoc(800, 600);
      if (!db) $('saved').innerHTML = '<span style="color:#ff4444">no storage</span>';
      setTool(ui.tool); setColor('primary', ui.primary); setColor('secondary', ui.secondary); setSize(ui.size); setShapeMode(ui.shapeMode); setGrid(ui.grid);
      setTol(ui.tol); setSnap(ui.snap); setSmooth(ui.smooth); setTextOpt('font', ui.font); selChanged();
    })();
  </script>
</body>
</html>
